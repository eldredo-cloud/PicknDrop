<h2>PicknDrop Dashboard</h2>
<div id="list"></div>

<script>
setInterval(async()=>{
  const res = await fetch("/drivers");
  const data = await res.json();

  document.getElementById("list").innerHTML =
    data.map(d =>
      `<p><b>${d.name}</b><br>
      Lat: ${d.lat}<br>
      Lng: ${d.lng}</p><hr>`
    ).join("");
},3000);
</script>
